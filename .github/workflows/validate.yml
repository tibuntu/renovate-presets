name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  presets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # ponytail: unpinned renovate on purpose, so presets are checked against the schema
      # the hosted Renovate app runs today; pin it if upstream schema changes ever break CI noisily.
      - run: npx --yes --package renovate -- renovate-config-validator --strict --no-global *.json
