name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  presets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # ponytail: unpinned renovate on purpose, so presets are checked against the schema
      # the hosted Renovate app runs today; pin it if upstream schema changes ever break CI noisily.
      - run: npx --yes --package renovate -- renovate-config-validator --strict *.json
